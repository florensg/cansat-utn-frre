# Cortex configuration -- auto-generated by cortex setup
# Project: CanSat (unknown)

episodic:
  persist_dir: memory
  collection_name: cortex_episodic
  embedding_model: all-MiniLM-L6-v2
  embedding_backend: onnx  # onnx | local | openai | fastembed
  namespace_mode: project  # project | branch | custom
  namespace_value: ""

# Obra 04: per-language embeddings. Spanish gets multilingual-e5-large
# (measured +9% MRR / +14% R@1 vs MiniLM on eval/retrieval); English keeps
# the lightweight default. Remove this block to fall back to single-model.
#
# DISABLED (2026-11-09): the `fastembed` extra is not installed on this
# machine (Python 3.14), so every embedding call failed and vault search
# raised "embedding failed for N chunks". Falling back to the default ONNX
# backend (all-MiniLM-L6-v2, already cached locally).
# Re-enable after `pip install cortex-memory[fastembed]`.
# embedding:
#   backend: fastembed
#   language_detection: heuristic
#   per_language:
#     es:
#       model: intfloat/multilingual-e5-large
#       backend: fastembed

semantic:
  vault_path: vault

retrieval:
  top_k: 5
  episodic_weight: 1.0
  semantic_weight: 1.0

llm:
  provider: none
  model: ""

integrations:
  jira:
    enabled: false
    base_url: ""
    email_env: JIRA_EMAIL
    token_env: JIRA_API_TOKEN
