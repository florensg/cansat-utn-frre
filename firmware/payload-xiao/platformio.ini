[platformio]
default_envs = xiao_vis

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:xiao_vis]
build_flags =
    ${env.build_flags}
    -D XIAO_CAMERA_ROLE_NIR=0
    -D XIAO_I2C_SLAVE_ADDR=0x30

[env:xiao_nir]
build_flags =
    ${env.build_flags}
    -D XIAO_CAMERA_ROLE_NIR=1
    -D XIAO_I2C_SLAVE_ADDR=0x31
