[platformio]
default_envs = obc

[env:obc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_ldf_mode = deep+

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = -<*>
