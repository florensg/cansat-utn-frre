[platformio]
default_envs = obc

[env:obc]
platform = ststm32
board = genericSTM32F103RB
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -Wl,-u,_printf_float
lib_ldf_mode = deep+

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
build_src_filter = -<*>
